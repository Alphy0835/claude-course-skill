<title><!--@SHORT--></title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@1,400;1,500&family=Geologica:wght@200;300;400;500&family=JetBrains+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Раскладка: слева рейка с программой, справа колонка чтения шириной около 68 знаков.
   Три голоса: тонкий гротеск — заголовки и врезки, книжная антиква — основной текст,
   моноширинный — «приборные» подписи. Курсивная антиква — только цель урока и акцент в названии.
   Вид один, тёмный; светлый включается кнопкой или выбором темы у зрителя. */
:root{
  color-scheme:dark;
  --bg:#090a0e; --bg-2:#0f1117; --bg-3:#171a23;
  --line:#20242f; --line-2:#333a4a;
  --fg:#e8e9ee; --fg-2:#aab0bd; --fg-3:#737a8a;
  --accent:#74d4ff; --accent-soft:rgba(116,212,255,.09);
  --violet:#a08cff; --good:#5fd7a4; --bad:#ff8088; --warn:#f0c259;
  --f-display:"Geologica","Segoe UI",system-ui,sans-serif;
  --f-text:"Literata",Georgia,"Times New Roman",serif;
  --f-accent:"Cormorant","Literata",Georgia,serif;
  --f-mono:"JetBrains Mono",Consolas,"Courier New",monospace;
  --rail:310px; --measure:68ch; --top:45px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f5f7; --bg-2:#eaecf0; --bg-3:#dfe2e8;
  --line:#d6dae2; --line-2:#b8bfcb;
  --fg:#12141a; --fg-2:#434957; --fg-3:#687080;
  --accent:#0074ad; --accent-soft:rgba(0,116,173,.08);
  --violet:#5b43d6; --good:#0f7a55; --bad:#c22f3c; --warn:#8a5c00;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-text);font-size:18px;line-height:1.7}
a{color:var(--accent);text-underline-offset:.18em;text-decoration-thickness:1px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
img{max-width:100%}
.hud{margin:0;font-family:var(--f-mono);font-size:12px;line-height:1.5;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}

/* Верхняя полоса */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;min-height:var(--top);padding:8px 20px;background:var(--bg);border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.top .brand{min-width:0;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg);text-decoration:none}
.top button{flex:none;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--fg-2);background:none;border:1px solid var(--line-2);border-radius:2px;padding:6px 10px;cursor:pointer}
.top button:hover{color:var(--fg);border-color:var(--fg-3)}
.top .count{flex:none}
.meter{position:absolute;left:0;right:0;bottom:-1px;height:1px}
.meter i{display:block;width:0;height:1px;background:var(--accent);transition:width .4s}
#navBtn{display:none}

/* Каркас */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top));max-height:calc(100dvh - var(--top));overflow-y:auto;padding:28px 20px 48px;border-right:1px solid var(--line);font-family:var(--f-display);font-weight:300;font-size:14px;line-height:1.35}
.rail ol{list-style:none;margin:0;padding:0}
.rail .rail-mods{display:grid;gap:22px;margin-top:22px}
.rail-mod{display:block;margin-bottom:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.rail-mods li li{display:grid;grid-template-columns:3.4ch minmax(0,1fr);gap:8px;padding:5px 0;color:var(--fg-3)}
.rail-mods li li a{display:contents;color:var(--fg-2);text-decoration:none}
.rail-mods li li a:hover .t{color:var(--fg)}
.rail .n{font-family:var(--f-mono);font-size:12px;color:var(--fg-3);padding-top:1px}
.rail li.is-done .n{color:var(--good)}
.rail a.is-current .t{color:var(--accent)}
.rail-extra{display:grid;gap:8px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.rail-extra a{color:var(--fg-2);text-decoration:none}
.rail-extra a:hover,.rail-extra a.is-current{color:var(--accent)}
.scrim{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.55)}

main{min-width:0;padding-block:56px 120px;padding-inline:clamp(16px,6vw,88px)}
/* Запас сверху: при открытии по ссылке с якорем браузер сам прокручивает к уроку, и без запаса полоса закрыла бы его начало */
.view{max-width:820px;scroll-margin-top:240px}

/* Первая страница */
.title{margin:18px 0 0;font-family:var(--f-display);font-weight:200;font-size:clamp(36px,6vw,74px);line-height:1.03;letter-spacing:-.02em;text-wrap:balance}
.title em{font-family:var(--f-accent);font-style:italic;font-weight:400;font-size:1.13em;letter-spacing:0;color:var(--accent)}
.lede{max-width:56ch;margin:26px 0 0;font-family:var(--f-display);font-weight:300;font-size:20px;line-height:1.5;color:var(--fg-2)}
.stats{display:flex;flex-wrap:wrap;gap:14px 44px;margin:40px 0 0;padding:20px 0;border-block:1px solid var(--line)}
.stats div{display:flex;flex-direction:column-reverse;gap:4px}
.stats dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.stats dd{margin:0;font-family:var(--f-display);font-weight:200;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.cta{display:inline-block;margin-top:32px;padding:14px 22px;border-radius:2px;background:var(--fg);color:var(--bg);font-family:var(--f-display);font-weight:500;font-size:16px;line-height:1.3;text-decoration:none}
.cta:hover{background:var(--accent)}
.home h2,.h-view{margin:72px 0 0;font-family:var(--f-display);font-weight:300;font-size:30px;line-height:1.15;letter-spacing:-.01em}
.h-view{margin-top:14px;font-weight:200;font-size:clamp(32px,4.6vw,54px)}
.outcome{list-style:none;margin:24px 0 0;padding:0;counter-reset:o;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:0 40px}
.outcome li{counter-increment:o;display:grid;grid-template-columns:2.4ch minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line);font-family:var(--f-display);font-weight:300;font-size:16px;line-height:1.5}
.outcome li::before{content:counter(o);font-family:var(--f-accent);font-style:italic;font-size:24px;line-height:1;color:var(--accent)}
.program{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:44px}
.mod-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start}
.mod-n{font-family:var(--f-display);font-weight:200;font-size:56px;line-height:.9;color:var(--fg-3)}
.mod-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.25}
.mod-head p{margin:6px 0 0;font-family:var(--f-display);font-weight:300;font-size:15px;line-height:1.5;color:var(--fg-2)}
.rows{list-style:none;margin:16px 0 0;padding:0}
.rows li{border-top:1px solid var(--line);color:var(--fg-3)}
.rows li>a,.rows li>span.row{display:grid;grid-template-columns:3.4ch minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:13px 0;font-family:var(--f-display);font-weight:300;font-size:16px;line-height:1.4;color:inherit;text-decoration:none}
.rows li>a{color:var(--fg)}
.rows li>a:hover .t{color:var(--accent)}
.rows .n,.rows .m{font-family:var(--f-mono);font-size:12px;color:var(--fg-3);white-space:nowrap}
.rows li.is-done .n{color:var(--good)}
.fine{max-width:64ch;margin:20px 0 0;font-family:var(--f-display);font-weight:300;font-size:15px;line-height:1.6;color:var(--fg-2)}
.fine ul{margin:8px 0 0;padding-left:1.2em}

/* Урок */
.lesson-head h1{margin:14px 0 0;font-family:var(--f-display);font-weight:200;font-size:clamp(31px,4.6vw,54px);line-height:1.07;letter-spacing:-.015em;text-wrap:balance}
.goal{max-width:36ch;margin:22px 0 0;font-family:var(--f-accent);font-style:italic;font-weight:400;font-size:27px;line-height:1.28;color:var(--fg-2)}
.prose{max-width:var(--measure);margin-top:52px;overflow-wrap:break-word}
.prose :where(p,ul,ol,dl,figure,blockquote,pre,h2,h3,h4){margin:0}
.prose>*+*{margin-top:1.15em}
.prose :is(section,aside,div,details,blockquote,li,figure)>*+*{margin-top:.85em}
.prose h2{margin-top:2.3em;font-family:var(--f-display);font-weight:300;font-size:29px;line-height:1.17;letter-spacing:-.01em;text-wrap:balance}
.prose h3{margin-top:1.9em;font-family:var(--f-display);font-weight:500;font-size:19px;line-height:1.3}
.prose h4{font-family:var(--f-display);font-weight:500;font-size:17px;line-height:1.35}
.prose :is(ul,ol){padding-left:1.35em}
.prose li+li{margin-top:.45em}
.prose strong{font-weight:600}
.prose blockquote{padding-left:20px;border-left:1px solid var(--line-2);color:var(--fg-2);font-style:italic}
.prose dfn{font-style:normal;font-weight:600;border-bottom:1px dotted var(--accent);cursor:help}
.prose code{padding:.1em .35em;border-radius:2px;background:var(--bg-3);font-family:var(--f-mono);font-size:.82em}
.prose pre{padding:18px 20px;border-radius:3px;background:var(--bg-2);overflow-x:auto;line-height:1.55}
.prose pre code{padding:0;background:none;font-size:14px}
.prose .lead{font-family:var(--f-display);font-weight:300;font-size:21px;line-height:1.55}

/* Врезки: тот же гротеск, что в заголовках, — другой голос рядом с основным текстом */
.prose aside{padding:16px 0 18px;border-block:1px solid var(--line-2);font-family:var(--f-display);font-weight:300;font-size:16px;line-height:1.6}
.prose aside::before,.prose .example::before{display:block;margin-bottom:8px;font-family:var(--f-mono);font-size:11px;font-weight:400;letter-spacing:.1em;text-transform:uppercase}
.prose aside.note::before{content:"Важно";color:var(--accent)}
.prose aside.pitfall::before{content:"Типичная ошибка";color:var(--warn)}
.prose aside.pro::before{content:"Как делает профи";color:var(--violet)}
.prose .example{padding:22px 24px 24px;border-radius:3px;background:var(--bg-2)}
.prose .example::before{content:"Разбор";color:var(--fg-3)}
.prose details{border-block:1px solid var(--line)}
.prose details+details{margin-top:0;border-top:0}
.prose summary{display:flex;gap:12px;align-items:baseline;padding:14px 0;list-style:none;cursor:pointer;font-family:var(--f-display);font-weight:400;font-size:16px;line-height:1.4}
.prose summary::-webkit-details-marker{display:none}
.prose summary::before{content:"+";flex:none;width:1ch;font-family:var(--f-mono);color:var(--accent)}
.prose details[open]>summary::before{content:"\2212"}
.prose details[open]{padding-bottom:20px}

/* Схемы и таблицы шире экрана листаются внутри своей рамки */
.prose figure{padding:20px;border-radius:3px;background:var(--bg-2)}
.prose figure .svg-wrap{overflow-x:auto}
.prose figure svg{display:block;width:100%;min-width:600px;height:auto;font-family:var(--f-display);font-size:15px}
.prose figure svg text{fill:var(--fg)}
.prose figure svg text.muted{fill:var(--fg-3)}
.prose figure svg text.accent{fill:var(--accent)}
.prose figure svg .box{fill:var(--bg-3);stroke:var(--line-2);stroke-width:1}
.prose figure svg .box-accent{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
.prose figure svg .line{fill:none;stroke:var(--fg-3);stroke-width:1.5}
.prose figure svg .line-accent{fill:none;stroke:var(--accent);stroke-width:1.5}
.prose figure svg .dash{stroke-dasharray:5 5}
.arrowhead{fill:var(--fg-3)}
.prose figcaption{font-family:var(--f-mono);font-size:12px;line-height:1.55;color:var(--fg-3)}
.scroll{overflow-x:auto}
/* Пометку ставит сценарий, когда схема или таблица не помещается: без неё обрезанный край выглядит поломкой */
.is-wide::before{content:"шире экрана · листай вбок →";position:sticky;left:0;display:block;width:max-content;margin-bottom:12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.prose table{width:100%;min-width:520px;border-collapse:collapse;font-family:var(--f-display);font-weight:300;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
.prose th{padding:0 18px 10px 0;border-bottom:1px solid var(--line-2);font-family:var(--f-mono);font-weight:400;font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-align:left;vertical-align:bottom;color:var(--fg-3)}
.prose td{padding:12px 18px 12px 0;border-bottom:1px solid var(--line);vertical-align:top}

/* Концовка урока: проверка, практика, итог, источники */
.prose>section:not(.lead){margin-top:3.4em;padding-top:1.7em;border-top:1px solid var(--line-2)}
.prose>section>h2{margin-top:0}
.quiz{padding-top:.6em}
.prose .quiz+.quiz{margin-top:2.1em}
.quiz .q{font-family:var(--f-display);font-weight:400;font-size:18px;line-height:1.45}
.prose .quiz ol{list-style:none;padding:0;counter-reset:q;display:grid;gap:6px}
.prose .quiz li{counter-increment:q;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;margin:0;padding:12px 14px;border:1px solid var(--line);border-radius:2px;font-family:var(--f-display);font-weight:300;font-size:16px;line-height:1.45}
.quiz li::before{content:counter(q);padding-top:3px;font-family:var(--f-mono);font-size:12px;color:var(--fg-3)}
.js .quiz:not(.answered) li{cursor:pointer}
.js .quiz:not(.answered) li:hover{border-color:var(--fg-3)}
.quiz li.is-right{border-color:var(--good);color:var(--good)}
.quiz li.is-wrong{border-color:var(--bad);color:var(--bad)}
.quiz li.is-right::before{content:"\2713";color:var(--good)}
.quiz li.is-wrong::before{content:"\00d7";color:var(--bad)}
.quiz .why{padding-left:16px;border-left:1px solid var(--line-2);font-family:var(--f-display);font-weight:300;font-size:16px;line-height:1.6;color:var(--fg-2)}
.js .quiz:not(.answered) .why{display:none}
.prose .summary li{font-family:var(--f-display);font-weight:300;font-size:17px;line-height:1.55}
.prose .sources{font-family:var(--f-display);font-weight:300;font-size:14px;line-height:1.55;color:var(--fg-2)}
.prose .sources h2{color:var(--fg)}
.lesson-foot{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;max-width:var(--measure);margin-top:64px;padding-top:28px;border-top:1px solid var(--line-2);font-family:var(--f-display);font-size:15px;line-height:1.4}
.btn{padding:12px 18px;border:1px solid var(--fg);border-radius:2px;background:var(--fg);color:var(--bg);font-family:var(--f-display);font-weight:500;font-size:15px;line-height:1.3;cursor:pointer}
.btn:hover{border-color:var(--accent);background:var(--accent)}
.btn[aria-pressed="true"]{border-color:var(--good);background:transparent;color:var(--good)}
.pager{display:flex;flex-wrap:wrap;gap:8px 24px}

/* Тренажёр и словарь */
.trainer-body{max-width:var(--measure);margin-top:40px}
.trainer-body .quiz ol{list-style:none;margin:16px 0 0;padding:0;counter-reset:q;display:grid;gap:6px}
.trainer-body .quiz li{counter-increment:q;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:2px;font-family:var(--f-display);font-weight:300;font-size:16px;line-height:1.45}
.trainer-body .quiz p{margin:0}
.trainer-body .quiz .why{margin-top:16px}
.trainer-body .next{margin-top:24px}
.score{margin:0;font-family:var(--f-display);font-weight:200;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.gloss{max-width:var(--measure);margin:36px 0 0}
.gloss div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px 24px;padding:14px 0;border-top:1px solid var(--line)}
.gloss dt{font-family:var(--f-display);font-weight:500;font-size:16px;line-height:1.4}
.gloss dd{margin:0;font-family:var(--f-display);font-weight:300;font-size:15px;line-height:1.55;color:var(--fg-2)}
.gloss dd a{white-space:nowrap;font-family:var(--f-mono);font-size:12px}

@media (max-width:920px){
  body{font-size:17px}
  .shell{grid-template-columns:minmax(0,1fr)}
  #navBtn{display:block}
  .rail{position:fixed;inset:0 auto 0 0;z-index:30;width:min(86vw,340px);max-height:none;padding-top:calc(env(safe-area-inset-top,0px) + 24px);background:var(--bg);transform:translateX(-100%);visibility:hidden;transition:transform .25s,visibility .25s}
  .rail.open{transform:none;visibility:visible}
  main{padding-block:36px 96px}
  .goal{font-size:23px}
  .gloss div{grid-template-columns:minmax(0,1fr)}
  .mod-n{font-size:40px}
  .rows li>a,.rows li>span.row{grid-template-columns:3.4ch minmax(0,1fr)}
  .rows .m{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <button type="button" id="navBtn" aria-controls="rail" aria-expanded="false">Программа</button>
  <a class="brand" href="#home"><!--@SHORT--></a>

</header>
<div class="scrim" id="scrim" hidden></div>
<div class="shell">

<!--@RAIL-->
  </nav>
  <main>
<!--@HOME-->
<!--@LESSONS-->
    <section class="view" id="trainer" hidden>
      <p class="hud">Тренажёр · вопросы всех уроков вперемешку</p>
      <h1 class="h-view">Проверка по всему курсу</h1>
      <div class="trainer-body" id="trainerBody"></div>
    </section>
<!--@GLOSSARY-->
  </main>
</div>
<script id="course-data" type="application/json"><!--@DATA--></script>
<script>
(function () {
  var root = document.documentElement;
  root.classList.add('js');
  var data = JSON.parse(document.getElementById('course-data').textContent);
  var KEY = 'course:' + data.slug + ':';

  // Хранилище браузера бывает недоступно (частное окно, предпросмотр) — страница обязана работать и без него.
  function load(name, fallback) {
    try { var raw = localStorage.getItem(KEY + name); return raw === null ? fallback : JSON.parse(raw); }
    catch (e) { return fallback; }
  }
  function save(name, value) {
    try { localStorage.setItem(KEY + name, JSON.stringify(value)); } catch (e) {}
  }
  function all(selector, scope) {
    return Array.prototype.slice.call((scope || document).querySelectorAll(selector));
  }
  function shuffle(list) {
    for (var i = list.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = list[i]; list[i] = list[j]; list[j] = t;
    }
    return list;
  }

  var done = load('done', []);
  var ids = data.lessons.map(function (l) { return l.id; });

  // Тема: по умолчанию тёмная; выбор запоминается.
  var themeBtn = document.getElementById('themeBtn');
  var saved = load('theme', null);
  if (saved) root.setAttribute('data-theme', saved);
  function paintTheme() {
    themeBtn.textContent = root.getAttribute('data-theme') === 'light' ? 'Тёмная' : 'Светлая';
  }
  themeBtn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    save('theme', next);
    paintTheme();
  });
  paintTheme();

  // Рейка с программой на узком экране выезжает поверх текста.
  var rail = document.getElementById('rail'), scrim = document.getElementById('scrim'), navBtn = document.getElementById('navBtn');
  function setRail(open) {
    rail.classList.toggle('open', open);
    scrim.hidden = !open;
    navBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  navBtn.addEventListener('click', function () { setRail(!rail.classList.contains('open')); });
  scrim.addEventListener('click', function () { setRail(false); });

  // Прогресс: пройденные уроки отмечает сам ученик.
  function paint() {
    var passed = ids.filter(function (id) { return done.indexOf(id) >= 0; }).length;
    document.getElementById('meterFill').style.width = ids.length ? (100 * passed / ids.length) + '%' : '0';
    all('[data-count]').forEach(function (el) { el.textContent = ids.length ? passed + ' из ' + ids.length : ''; });
    all('[data-lesson]').forEach(function (el) {
      el.classList.toggle('is-done', done.indexOf(el.getAttribute('data-lesson')) >= 0);
    });
    all('[data-done]').forEach(function (btn) {
      var on = done.indexOf(btn.getAttribute('data-done')) >= 0;
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      btn.textContent = on ? 'Урок пройден' : 'Отметить пройденным';
    });
    var cta = document.getElementById('resume');
    if (cta && ids.length) {
      var next = ids.filter(function (id) { return done.indexOf(id) < 0; })[0];
      if (!next) { cta.textContent = 'Пройти проверку по всему курсу'; cta.setAttribute('href', '#trainer'); }
      else {
        cta.textContent = passed ? 'Продолжить: урок ' + next : 'Начать с урока ' + next;
        cta.setAttribute('href', '#l-' + next);
      }
    }
  }
  all('[data-done]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var id = btn.getAttribute('data-done'), at = done.indexOf(id);
      if (at >= 0) done.splice(at, 1); else done.push(id);
      save('done', done);
      paint();
    });
  });

  // Вопросы: ответ даётся один раз, после него видно объяснение.
  function wireQuiz(quiz, onAnswer) {
    var options = all('ol > li', quiz);
    var right = parseInt(quiz.getAttribute('data-answer'), 10) - 1;
    options.forEach(function (li, i) {
      li.tabIndex = 0;
      li.setAttribute('role', 'button');
      function pick() {
        if (quiz.classList.contains('answered')) return;
        quiz.classList.add('answered');
        li.classList.add(i === right ? 'is-right' : 'is-wrong');
        if (options[right]) options[right].classList.add('is-right');
        options.forEach(function (o) { o.removeAttribute('tabindex'); o.removeAttribute('role'); });
        if (onAnswer) onAnswer(i === right);
      }
      li.addEventListener('click', pick);
      li.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); }
      });
    });
  }
  var bank = [];
  all('.lesson').forEach(function (lesson) {
    all('.quiz', lesson).forEach(function (quiz) {
      bank.push({ id: lesson.getAttribute('data-id'), title: lesson.getAttribute('data-title'), source: quiz.cloneNode(true) });
      wireQuiz(quiz);
    });
  });

  // Тренажёр: те же вопросы, но вперемешку и с перемешанными вариантами.
  var trainerBody = document.getElementById('trainerBody'), run = null;
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text) node.textContent = text;
    return node;
  }
  function startTrainer() {
    run = { order: shuffle(bank.slice()), at: 0, score: 0, missed: {} };
    step();
  }
  function step() {
    trainerBody.innerHTML = '';
    if (!bank.length) {
      trainerBody.appendChild(el('p', 'fine', 'Вопросы появятся здесь, когда будут написаны уроки.'));
      return;
    }
    if (run.at >= run.order.length) { finish(); return; }
    var item = run.order[run.at];
    trainerBody.appendChild(el('p', 'hud', 'Вопрос ' + (run.at + 1) + ' из ' + run.order.length + ' · из урока ' + item.id));
    var quiz = item.source.cloneNode(true);
    var list = quiz.querySelector('ol'), options = all('li', list);
    var right = options[parseInt(quiz.getAttribute('data-answer'), 10) - 1];
    shuffle(options).forEach(function (li) { list.appendChild(li); });
    quiz.setAttribute('data-answer', options.indexOf(right) + 1);
    trainerBody.appendChild(quiz);
    wireQuiz(quiz, function (ok) {
      if (ok) run.score++; else run.missed[item.id] = item.title;
      var next = el('button', 'btn next', run.at + 1 < run.order.length ? 'Следующий вопрос' : 'Показать результат');
      next.type = 'button';
      next.addEventListener('click', function () { run.at++; step(); window.scrollTo(0, 0); });
      trainerBody.appendChild(next);
      next.focus();
    });
  }
  function finish() {
    trainerBody.appendChild(el('p', 'hud', 'Верных ответов'));
    trainerBody.appendChild(el('p', 'score', run.score + ' из ' + run.order.length));
    var missed = Object.keys(run.missed).sort();
    if (missed.length) {
      trainerBody.appendChild(el('p', 'fine', 'Ошибки были в вопросах этих уроков — их стоит перечитать:'));
      var list = el('ul', 'fine');
      missed.forEach(function (id) {
        var li = el('li'), a = el('a', '', 'Урок ' + id + '. ' + run.missed[id]);
        a.setAttribute('href', '#l-' + id);
        li.appendChild(a);
        list.appendChild(li);
      });
      trainerBody.appendChild(list);
    } else {
      trainerBody.appendChild(el('p', 'fine', 'Ни одной ошибки.'));
    }
    var again = el('button', 'btn next', 'Пройти ещё раз');
    again.type = 'button';
    again.addEventListener('click', startTrainer);
    trainerBody.appendChild(again);
  }

  // Переходы: у каждого урока и раздела свой якорь в адресе.
  var views = all('.view');
  function show(id) {
    var target = document.getElementById(id);
    if (!target || !target.classList.contains('view')) { id = 'home'; target = document.getElementById('home'); }
    views.forEach(function (view) { view.hidden = view !== target; });
    all('[data-nav]').forEach(function (a) { a.classList.toggle('is-current', a.getAttribute('data-nav') === id); });
    setRail(false);
    if (id === 'trainer' && !run) startTrainer();
    markWide();
    window.scrollTo(0, 0);
  }
  // Схемы и таблицы шире экрана листаются вбок внутри своей рамки; помечаем такие, пока урок на экране.
  function markWide() {
    all('.scroll, .svg-wrap').forEach(function (box) {
      box.classList.toggle('is-wide', box.scrollWidth > box.clientWidth + 2);
    });
  }
  window.addEventListener('resize', markWide);
  window.addEventListener('hashchange', function () { show(location.hash.slice(1) || 'home'); });
  paint();
  show(location.hash.slice(1) || 'home');
})();
</script>
